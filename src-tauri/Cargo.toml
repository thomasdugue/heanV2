[package]
name = "hean"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
description = "Hean — lecteur de musique audiophile macOS"
publish = false

[lib]
name = "hean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# IPC typée : les types TypeScript du front sont GÉNÉRÉS depuis ces annotations (ADR 0002).
# Versions épinglées à l'exact : tauri-specta pour Tauri v2 n'existe qu'en release candidate,
# et specta est lui-même épinglé « = » par tauri-specta.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

# Observabilité. println!/eprintln! sont INTERDITS dans ce crate (INV, test d'architecture) :
# V1 en comptait 252 contre 3 appels tracing::, et son logging ne capturait pas stdout —
# 63 lignes de journal pour toute la vie de l'app installée.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Décodage audio (ADR 0002 : jamais CPAL — mais le décodage, lui, est celui de V1).
# Les features sont EXPLICITES et limitées aux formats annoncés comme supportés : FLAC, WAV,
# AIFF, ALAC, MP3, AAC/M4A, OGG Vorbis. WMA, DSD, Opus et MQA ne le sont pas, et les laisser
# hors de cette liste est ce qui rend l'absence de support vérifiable au lieu d'accidentelle.
symphonia = { version = "0.5", default-features = false, features = [
  "flac", "wav", "aiff", "alac", "mp3", "aac", "isomp4", "vorbis", "ogg", "pcm",
] }

# Store de bibliothèque (ADR 0002). `bundled` compile SQLite dans le binaire : aucune
# dépendance système, ~1 Mo. Présent dès le socle pour que le choix soit VÉRIFIÉ, pas supposé.
rusqlite = { version = "0.43", features = ["bundled"] }

# Métadonnées audio (ADR 0009). lofty LIT et ÉCRIT les tags : c'est la bibliothèque de V1,
# et c'est elle qui rend INV-07 tenable — la source de vérité d'une métadonnée est le
# fichier audio, pas la base. Épinglée en 0.22 : les versions suivantes exigent rustc 1.89,
# au-delà de la `rust-version` du crate (ADR 0008 — la chaîne d'outils est épinglée).
lofty = "0.22"

# NAS/SMB (ADR 0016). `pavao` enveloppe `libsmbclient`, la bibliothèque C de Samba — donc
# `brew install samba` est nécessaire pour COMPILER (son build.rs panique sinon, et la CI
# l'installe). C'est le prix du seul chemin qui lit un partage SMB sans l'avoir monté :
# monter le volume donnerait des chemins `/Volumes/...`, c'est-à-dire une autre identité de
# piste à chaque montage, et des pistes « disparues » dès le volume démonté.
# ⚠️ `libsmbclient` est un SINGLETON de process (PLAT-2, 🔴) : tout passe par un mutex unique.
pavao = "0.2"

# Keychain macOS pour les mots de passe SMB (ADR 0015). Le mot de passe ne touche jamais le
# disque de l'app : ni dans la base, ni dans un JSON.
security-framework = "3"

# Normalisation Unicode (ADR 0009). Le SEUL usage légitime est `AlbumKey::new` : trois bugs
# de V1 venaient d'une normalisation (trim + NFC) réécrite à plusieurs endroits.
unicode-normalization = "0.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dev-dependencies]
# Property-based testing (HARNAIS.md §4). On ne teste plus des exemples mais des
# propriétés : `AlbumKey::new` est idempotente, et deux écritures Unicode équivalentes
# donnent la même clé pour TOUTE chaîne générée.
proptest = "1"
