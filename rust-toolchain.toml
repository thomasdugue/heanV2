# La chaîne d'outils Rust, épinglée à une version exacte (ADR 0007).
#
# Pourquoi : `./check` promet d'exécuter la MÊME chose en local, en pre-commit et en CI.
# C'était vrai pour le JavaScript — `package-lock.json` fige ses versions au patch près — et
# FAUX pour Rust, où la CI demandait « stable », c'est-à-dire la dernière version du jour.
# Constaté le 2026-11-22 : `./check` vert en local, rouge en CI, sur du code identique, parce
# que le runner avait un clippy plus récent que la machine de Thomas. Le lint n'était que le
# symptôme ; la promesse, elle, était fausse.
#
# Contrepartie assumée : on ne voit plus arriver les nouveaux lints tant que personne ne monte
# cette version. C'est l'audit hebdomadaire qui le signale — une ligne à lire, pas un build
# rouge un matin sans qu'aucun commit n'ait bougé.
#
# Pour monter de version : changer `channel` ici, lancer `./check`, corriger ce que le nouveau
# clippy trouve, et commiter le tout ensemble. C'est un acte délibéré, pas une dérive.
[toolchain]
channel = "1.93.1"
components = ["clippy"]
profile = "minimal"
