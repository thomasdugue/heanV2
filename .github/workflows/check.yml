name: check

# UN SEUL job, qui lance UNE SEULE commande : `./check`.
# C'est volontaire. En V1 la CI avait ses propres étapes (node --check, Jest, cargo test),
# donc elle pouvait diverger du local sans que personne le voie. Ici elle ne le peut pas :
# ajouter une vérification se fait dans ./check, et la CI en hérite.
#
# macOS obligatoire : l'app est macOS-only (CoreAudio, souvlaki, libsmbclient).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Pas de `dtolnay/rust-toolchain@stable` : il installait « la dernière version du
      # jour », donc la CI compilait avec un autre compilateur que la machine de Thomas.
      # La version vient de `rust-toolchain.toml`, et d'elle seule — une seule source
      # (ADR 0008). `rustup show` l'installe, avec les composants qu'elle déclare.
      - name: Chaîne Rust épinglée
        run: |
          rustup show
          rustc --version
          cargo clippy --version

      # `libsmbclient`, la bibliothèque C de Samba. Le `build.rs` de `pavao-sys` PANIQUE si
      # `pkg-config` ne la trouve pas, donc c'est une dépendance de **compilation** et pas
      # seulement d'exécution : sans cette étape, rien ne compile (ADR 0016, conséquences).
      # La formule est keg-only, d'où le `PKG_CONFIG_PATH` exporté pour toutes les étapes
      # suivantes. La machine de Thomas l'a déjà, depuis V1.
      - name: libsmbclient (Samba)
        run: |
          brew install samba
          echo "PKG_CONFIG_PATH=$(brew --prefix samba)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          pkg-config --modversion smbclient

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: ./check
        run: ./check
